<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="M-Testco Operations Hub">
  <title>M-Testco Operations Hub</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #080b0e;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      background: #080b0e;
    }

    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /*
      Transparent button areas are ready to activate.
      Replace # with the final destination URL for each button.
    */
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 8px;
      text-indent: -9999px;
      overflow: hidden;
    }

    .hotspot:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .ask-sam {
      left: 5.1%;
      top: 65.9%;
      width: 13.5%;
      height: 7.8%;
    }

    .service-intake {
      left: 21.5%;
      top: 65.9%;
      width: 15.2%;
      height: 7.8%;
    }

    .upload-certificate {
      left: 37.2%;
      top: 65.9%;
      width: 14.5%;
      height: 7.8%;
    }

    @media (max-width: 700px) {
      .hero {
        min-height: 520px;
        aspect-ratio: auto;
      }

      .hero img {
        object-position: 66% center;
      }

      .hotspot {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero" aria-label="M-Testco Operations Hub">
    <img src="hero.png" alt="M-Testco Operations Hub">
    <a class="hotspot ask-sam" href="#" aria-label="Ask SAM">Ask SAM</a>
    <a class="hotspot service-intake" href="#" aria-label="Submit Service Intake">Submit Service Intake</a>
    <a class="hotspot upload-certificate" href="#" aria-label="Upload Certificate">Upload Certificate</a>
  </main>
</body>
</html>
